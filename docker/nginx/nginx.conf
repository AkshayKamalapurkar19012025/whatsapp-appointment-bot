# Same-origin deployment (Phase A, docs/DEPLOYMENT.md-equivalent context in
# the docker-compose.yml comments): this is the only origin the browser
# ever sees. /api and /media are reverse-proxied straight through to the
# app container with the request path untouched (proxy_pass with no path
# component after the host:port -- same effect as vite.config.ts's dev-time
# proxy, just for production), and everything else falls back to
# index.html for the SPA's own client-side routing (patient app on most
# paths, admin app under /admin and /staff -- see frontend/src/main.tsx).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets: Vite fingerprints these filenames on every build, so
    # they're safe to cache aggressively; index.html itself is excluded
    # below (must always be revalidated, or a deploy's new asset
    # filenames would 404 against a stale cached index.html).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded doctor profile photos (app/config.py's MEDIA_ROOT, served
    # by app/main.py's StaticFiles mount) -- proxied, not shared via a
    # volume with the app container, so this image has zero runtime
    # dependency on where the app stores its files.
    location /media/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
